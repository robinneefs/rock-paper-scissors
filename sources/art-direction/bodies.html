<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
body{margin:0;background:#0d0a18;color:#f2ecff;font-family:'Pixelify Sans',monospace;width:1920px}
h1{margin:0;padding:34px 48px 6px;font-size:44px;letter-spacing:2px}
.sub{padding:0 48px 24px;font-size:24px;color:#a99bd6}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;padding:0 48px 48px}
.card{background:#171230;border:3px solid #2e2554;padding:18px 20px}
.card h2{margin:0 0 4px;font-size:30px}
.card p{margin:0 0 12px;font-size:20px;color:#b9acdf;line-height:1.3;min-height:52px}
canvas{display:block;image-rendering:pixelated;margin:0 auto}
</style></head><body>
<h1>Nine body shapes</h1>
<div class="sub">Same Soft pastel look, same idle guard. Only the character's build changes. About 48 px tall, shown at 7x.</div>
<div class="grid" id="g"></div>
<script src="art.js"></script><script src="styles.js"></script><script src="bodies.js"></script>
<script>
const PAL={gi:[252,248,242],giS:[200,190,222],belt:[96,80,128],beltS:[66,52,96],band:[255,118,140],bandS:[214,80,112],skin:[255,216,190],skinS:[238,168,152],hair:[104,78,124],hairS:[72,50,92]};
const S={pal:PAL,hi:0.35,iris:[120,70,60],blush:[255,140,150],mouth:[170,90,90],seloutF:0.55};
const D=[
 {name:'1 · Current',desc:'The build from the earlier sheets, for comparison: big head, wide stance.',
  head:{hx:1,hy:13,rx:9.6,ry:9},torso:{type:'box',top:21.5,topW:8.6,botW:8.6},legLen:13.5,legW:3.9,stance:10,armW:3.2,fist:3.4,armDrop:3,hair:'spiky'},
 {name:'2 · Dumpling',desc:'Round little body like a rice ball, stubby legs. Very soft and squeezable.',
  head:{hx:1,hy:13,rx:10,ry:9.5},torso:{type:'ball',top:21,topW:11,botW:11},legLen:6,legW:4,stance:6,armW:3,fist:3.8,armDrop:2,hair:'round'},
 {name:'3 · Lanky teen',desc:'Smaller head, long legs and thin arms. Cool and nimble, less chibi.',
  head:{hx:1,hy:8,rx:6.4,ry:6.6},torso:{type:'trap',top:14.5,topW:7,botW:5.5},legLen:21,legW:2.7,stance:9,armW:2,fist:2.5,armDrop:4,hair:'spiky',eyeH:3},
 {name:'4 · Brawler',desc:'Huge shoulders and fists, small head with a topknot. Tough but still cute.',
  head:{hx:2,hy:12,rx:6.6,ry:6.4},torso:{type:'trap',top:15,topW:13.5,botW:7},legLen:13,legW:3.8,stance:10,armW:4.2,fist:5,armDrop:3,hair:'bun',eyeH:3,fistF:[14,23],fistB:[9,26]},
 {name:'5 · Little kid',desc:'Giant head on a tiny body, bowl cut, tiny fists. The cutest, least threatening.',
  head:{hx:0.5,hy:14,rx:12.5,ry:12},torso:{type:'box',top:26.5,topW:6.5,botW:6.5},legLen:9,legW:3,stance:4.5,armW:2.4,fist:2.9,armDrop:1.5,hair:'bowl',eyeH:5,fistF:[10,27.5],fistB:[5.5,30]},
 {name:'6 · Shonen hero',desc:'V-shaped torso, wild spiky hair, wide lunge. Anime main-character energy.',
  head:{hx:2,hy:12,rx:7.6,ry:7.6},torso:{type:'trap',top:19,topW:9.5,botW:6.5},legLen:15,legW:3.1,stance:12,armW:2.7,fist:3.2,armDrop:3,hair:'big',eyeH:3},
 {name:'7 · Blocky toy',desc:'Square head, boxy body and square fists, like a toy figure. Very readable.',
  blocky:true,head:{hx:1,hy:12,rx:8.5,ry:7.8},torso:{type:'box',top:20.5,topW:9,botW:9},legLen:12,legW:3.6,stance:8,armW:3,fist:3.2,armDrop:2.5,hair:'bowl'},
 {name:'8 · Bean',desc:'Pear-shaped, wider at the bottom, no neck. Bouncy and mascot-like.',
  head:{hx:1,hy:13.5,rx:9,ry:8.4},torso:{type:'pear',top:21,topW:7,botW:11},legLen:6.5,legW:3.6,stance:7,armW:2.7,fist:3.3,armDrop:2,hair:'round'},
 {name:'9 · Cat fighter',desc:'Wildcard: a cat in a gi, with ears, a muzzle and a tail. Same moves, more personality.',
  cat:true,tail:true,head:{hx:1.5,hy:15,rx:10,ry:8.6},torso:{type:'box',top:23,topW:7.6,botW:7.6},legLen:11,legW:3.4,stance:8,armW:2.8,fist:3.3,armDrop:2.5,
  pal:{...PAL,skin:[255,182,108],skinS:[228,134,74]}},
];
const W=72,H=62,GY=56,g=document.getElementById('g');
for(const B of D){
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
 const img=ctx.createImageData(W,H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=y<GY?[255,236,222]:y===GY?[170,206,176]:[214,236,214];const i=(y*W+x)*4;img.data.set([...c,255],i);}
 for(let xx=-10;xx<=10;xx++)for(let yy=0;yy<2;yy++){const i=((GY+1+yy)*W+33+xx)*4;for(let c=0;c<3;c++)img.data[i+c]=Math.round(img.data[i+c]*0.85);}
 drawBody(img,W,H,{...S,pal:B.pal||PAL},B,32,GY+1);
 ctx.putImageData(img,0,0);cv.style.width=W*7+'px';cv.style.height=H*7+'px';
 const card=document.createElement('div');card.className='card';card.innerHTML=`<h2>${B.name}</h2><p>${B.desc}</p>`;card.appendChild(cv);g.appendChild(card);
}
</script></body></html>
