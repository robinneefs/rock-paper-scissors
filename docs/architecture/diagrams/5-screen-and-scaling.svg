<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<title>Screen layout and scaling</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="660" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Screen: one pixel grid, two scaling modes</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The canvas covers the whole window at native resolution. The cabinet sits in the middle; the rest is arcade room.</text><text x="40" y="98" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A. Cabinet at native size (270 × 472)</text><rect x="40" y="110" width="270" height="472" fill="#3a2466" stroke="#1d1533" stroke-width="1"/><rect x="40" y="110" width="270" height="32" fill="#ff4fa8"/><text x="175" y="131" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">marquee 32</text><rect x="67" y="154" width="216" height="288" fill="url(#grid)" stroke="#3ff0ff" stroke-width="1"/><text x="175" y="274" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MONITOR</text>
<text x="175" y="290.2" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">216 × 288 at (27, 44)</text>
<text x="175" y="306.4" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="175" y="322.6" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Logo / Home / Options /</text>
<text x="175" y="338.8" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fight / Result scenes</text>
<text x="175" y="355" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">draw here</text>
<text x="175" y="371.20000000000005" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(useMonitorCamera)</text><rect x="40" y="454" width="270" height="128" fill="#4b2f80"/><text x="175" y="476" font-size="12" font-weight="700" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">CONTROL PANEL 128</text><circle cx="152" cy="504" r="17" fill="#ff4f6d" stroke="#120826" stroke-width="2"/><circle cx="210" cy="504" r="17" fill="#ffcf3f" stroke="#120826" stroke-width="2"/><circle cx="268" cy="504" r="17" fill="#3fd0ff" stroke="#120826" stroke-width="2"/><circle cx="84" cy="504" r="9" fill="#ff4f6d" stroke="#120826" stroke-width="2"/><path d="M 84 513 v 20" stroke="#120826" stroke-width="5"/><text x="175" y="562" font-size="11.5" font-weight="400" text-anchor="middle" fill="#cbbcff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">CabinetScene: always on</text><text x="40" y="606" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sizes live in apps/game/src/config/layout.ts</text>
<text x="40" y="622.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(CABINET, MONITOR, PANEL, BUTTONS, STAGE).</text><text x="360" y="98" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">B. Desktop browser 1920 × 960</text><rect x="360" y="110" width="360" height="180" fill="url(#grid)" stroke="#1d1533"/><rect x="489.375" y="111.5" width="101.25" height="177" fill="#4b2f80" stroke="#3ff0ff"/><text x="540" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">540 × 944</text><text x="370" y="132" font-size="11" font-weight="400" text-anchor="start" fill="#cbbcff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">arcade room</text><text x="360" y="312" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">960 ÷ 472 = 2.03. Pixel perfect: 2×, every pixel</text>
<text x="360" y="328.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">even. Fill height: 2.03×, fills the window height.</text><text x="760" y="98" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">C. Phone 1080 × 2340</text><rect x="760" y="110" width="200" height="433" rx="18" fill="url(#grid)" stroke="#1d1533" stroke-width="2"/><rect x="760" y="151.6851851851852" width="200" height="349.6296296296296" fill="#4b2f80" stroke="#3ff0ff"/><text x="860" y="330.5" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1080 × 1888</text><text x="760" y="565" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1080 ÷ 270 = 4: both modes</text>
<text x="760" y="581.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">give 4× (width is the limit).</text><rect x="360" y="340" width="380" height="250" rx="12" fill="#ffffff" stroke="#e7e3f3" stroke-width="2"/><text x="376" y="366" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">computeLayout() in platform/PixelScaler.ts</text><text x="376" y="392" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">devW = innerWidth  × devicePixelRatio</text>
<text x="376" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">devH = innerHeight × devicePixelRatio</text>
<text x="376" y="428" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">fit  = min(devW / 270, devH / 472)</text>
<text x="376" y="446" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="376" y="464" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pixelPerfect: scale = max(1, floor(fit))</text>
<text x="376" y="482" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">fillHeight:   scale = max(1, fit)</text>
<text x="376" y="500" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="376" y="518" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">canvas = ceil(dev / scale) native px</text>
<text x="376" y="536" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">zoom   = scale / devicePixelRatio</text><text x="376" y="566" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fill height is the default (since v0.3.0). Re-run on</text>
<text x="376" y="582.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">resize, rotation and when Options changes the mode.</text>
</svg>