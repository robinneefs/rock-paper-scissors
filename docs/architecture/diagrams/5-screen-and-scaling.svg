<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<title>Screen layout and integer scaling</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="660" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Screen: one pixel grid, whole-number scaling</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The canvas covers the whole window. The cabinet sits in the middle at the biggest whole scale that fits; the rest is arcade room.</text><text x="40" y="98" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A. Cabinet at native size (270 × 472)</text><rect x="40" y="110" width="270" height="472" fill="#3a2466" stroke="#1d1533" stroke-width="1"/><rect x="40" y="110" width="270" height="32" fill="#ff4fa8"/><text x="175" y="131" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">marquee 32</text><rect x="67" y="154" width="216" height="288" fill="url(#grid)" stroke="#3ff0ff" stroke-width="1"/><text x="175" y="284" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MONITOR</text>
<text x="175" y="300.2" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">216 × 288</text>
<text x="175" y="316.4" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="175" y="332.6" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Title / Fight / Result</text>
<text x="175" y="348.8" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">scenes draw here</text>
<text x="175" y="365" font-size="12" font-weight="600" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(camera viewport)</text><rect x="40" y="454" width="270" height="128" fill="#4b2f80"/><text x="175" y="476" font-size="12" font-weight="700" text-anchor="middle" fill="#e8e0ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">CONTROL PANEL 128</text><circle cx="165" cy="520" r="17" fill="#ff4f6d" stroke="#120826" stroke-width="2"/><circle cx="213" cy="520" r="17" fill="#ffcf3f" stroke="#120826" stroke-width="2"/><circle cx="261" cy="520" r="17" fill="#3fd0ff" stroke="#120826" stroke-width="2"/><circle cx="92" cy="520" r="9" fill="#ff4f6d" stroke="#120826" stroke-width="2"/><path d="M 92 529 v 20" stroke="#120826" stroke-width="5"/><text x="175" y="566" font-size="11.5" font-weight="400" text-anchor="middle" fill="#cbbcff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">CabinetScene: always on</text><text x="40" y="606" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Cabinet target height 472 so that it</text>
<text x="40" y="622.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">shows at 2× in a 1080p browser window.</text>
<text x="40" y="638.4" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(mock-up today: 502, trim marquee/panel)</text><text x="360" y="98" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">B. Desktop browser 1920 × 960 → 2×</text><rect x="360" y="110" width="360" height="180" fill="url(#grid)" stroke="#1d1533"/><rect x="489.375" y="111.5" width="101.25" height="177" fill="#4b2f80" stroke="#3ff0ff"/><text x="540" y="204" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">540 × 944</text><text x="370" y="132" font-size="11" font-weight="400" text-anchor="start" fill="#cbbcff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">arcade room</text><text x="360" y="312" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">960 ÷ 472 = 2.03 → scale 2. The leftover is arcade</text>
<text x="360" y="328.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">room drawn at the same 2× pixel size, never stretch.</text><text x="760" y="98" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">C. Phone 1080 × 2340 → 4×</text><rect x="760" y="110" width="200" height="433" rx="18" fill="url(#grid)" stroke="#1d1533" stroke-width="2"/><rect x="760" y="151.6851851851852" width="200" height="349.6296296296296" fill="#4b2f80" stroke="#3ff0ff"/><text x="860" y="330.5" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1080 × 1888</text><text x="760" y="565" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1080 ÷ 270 = 4. Extra height</text>
<text x="760" y="581.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">shows floor and marquee light.</text><rect x="360" y="340" width="380" height="210" rx="12" fill="#ffffff" stroke="#e7e3f3" stroke-width="2"/><text x="376" y="366" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">How the scale is picked</text><text x="376" y="392" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">deviceW = innerWidth  × devicePixelRatio</text>
<text x="376" y="411" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">deviceH = innerHeight × devicePixelRatio</text>
<text x="376" y="430" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">scale   = max(1, floor(min(</text>
<text x="376" y="449" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">            deviceW / 270, deviceH / 472)))</text>
<text x="376" y="468" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">canvas  = ceil(device / scale)  native px</text>
<text x="376" y="487" font-size="12" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">zoom    = scale   (nearest neighbour)</text><text x="376" y="520" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Re-run on resize and rotation.</text>
</svg>