<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
<title>Online hosting options</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="540" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Where online matches could run (the game files stay on GitHub Pages)</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">GitHub Pages only serves files, so the two players need something live in between. Three free ways to do it:</text><rect x="32" y="88" width="300" height="420" rx="14" fill="#ffffff" stroke="#2e9d4f" stroke-width="3"/><text x="48" y="116" font-size="15" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A. Cloudflare Durable Object</text><text x="48" y="136" font-size="11.5" font-weight="800" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">RECOMMENDED</text><rect x="72" y="156" width="220" height="92" rx="10" fill="#dcf6e1" stroke="#2e9d4f" stroke-width="2"/><text x="86" y="180" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Match room</text><text x="86" y="202" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">one Durable Object per room</text>
<text x="86" y="218.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">runs the same Referee</text>
<text x="86" y="235.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(@rps/core) + the timer</text><rect x="52" y="300" width="110" height="44" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="107" y="327" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player A</text><rect x="202" y="300" width="110" height="44" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="257" y="327" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player B</text><path d="M 107 298 L 142 250" fill="none" stroke="#2e9d4f" stroke-width="2" marker-start="url(#a-server)" marker-end="url(#a-server)"/><path d="M 257 298 L 222 250" fill="none" stroke="#2e9d4f" stroke-width="2" marker-start="url(#a-server)" marker-end="url(#a-server)"/><text x="182" y="284" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WebSocket</text><text x="48" y="378" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ server decides: picks stay secret</text>
<text x="48" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ free plan: 100k requests a day</text>
<text x="48" y="412" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ wakes in milliseconds, no sleep</text>
<text x="48" y="429" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ TypeScript, shares packages/core</text><text x="48" y="452" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− needs a free Cloudflare account</text>
<text x="48" y="469" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− room code written by us (~200</text>
<text x="48" y="486" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">   lines), not Colyseus</text><rect x="350" y="88" width="300" height="420" rx="14" fill="#ffffff" stroke="#e7e3f3" stroke-width="2"/><text x="366" y="116" font-size="15" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">B. Peer-to-peer (PeerJS)</text><rect x="370" y="190" width="110" height="44" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="425" y="217" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player A (host)</text><rect x="520" y="190" width="110" height="44" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="575" y="217" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player B</text><path d="M 482 212 L 518 212" fill="none" stroke="#d6337f" stroke-width="2" marker-start="url(#a-pres)" marker-end="url(#a-pres)"/><text x="500" y="182" font-size="11.5" font-weight="600" text-anchor="middle" fill="#d6337f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WebRTC</text><rect x="370" y="266" width="120" height="44" rx="8" fill="#f7f5fd" stroke="#8f86ad" stroke-width="2" stroke-dasharray="6 5"/><text x="430" y="286" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">signalling</text>
<text x="430" y="299" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(PeerJS cloud)</text><rect x="510" y="266" width="120" height="44" rx="8" fill="#f7f5fd" stroke="#8f86ad" stroke-width="2" stroke-dasharray="6 5"/><text x="570" y="286" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">TURN relay for</text>
<text x="570" y="299" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">strict networks</text><path d="M 430 264 L 425 236" fill="none" stroke="#8f86ad" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-line)"/><path d="M 570 264 L 575 236" fill="none" stroke="#8f86ad" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-line)"/><text x="500" y="340" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">the host's browser runs the Referee</text><text x="366" y="378" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ no server code to deploy</text>
<text x="366" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ free signalling and STUN</text>
<text x="366" y="412" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ lowest delay when it connects</text><text x="366" y="435" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− host could peek at picks unless</text>
<text x="366" y="452" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">   we add commit-reveal hashing</text>
<text x="366" y="469" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− some networks fail without TURN</text>
<text x="366" y="486" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− free PeerJS cloud: no guarantees</text><rect x="668" y="88" width="300" height="420" rx="14" fill="#ffffff" stroke="#e7e3f3" stroke-width="2"/><text x="684" y="116" font-size="15" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">C. Colyseus on Render (free)</text><rect x="708" y="156" width="220" height="92" rx="10" fill="#f7f5fd" stroke="#2e9d4f" stroke-width="2"/><text x="722" y="180" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Node + Colyseus</text><text x="722" y="202" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the original plan</text>
<text x="722" y="218.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MatchRoom runs the Referee</text>
<text x="722" y="235.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">on a free web service</text><rect x="688" y="300" width="110" height="44" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="743" y="327" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player A</text><rect x="838" y="300" width="110" height="44" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="893" y="327" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player B</text><path d="M 743 298 L 778 250" fill="none" stroke="#2e9d4f" stroke-width="2" marker-start="url(#a-server)" marker-end="url(#a-server)"/><path d="M 893 298 L 858 250" fill="none" stroke="#2e9d4f" stroke-width="2" marker-start="url(#a-server)" marker-end="url(#a-server)"/><text x="818" y="284" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WebSocket</text><text x="684" y="378" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ server decides: picks stay secret</text>
<text x="684" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ Colyseus does rooms + reconnects</text>
<text x="684" y="412" font-size="12" font-weight="400" text-anchor="start" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ plain Node, easy to move later</text><text x="684" y="435" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− free service sleeps after 15 min</text>
<text x="684" y="452" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">   idle; ~1 min to wake up</text>
<text x="684" y="469" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− 750 free hours a month</text>
<text x="684" y="486" font-size="12" font-weight="400" text-anchor="start" fill="#d0412b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">− Colyseus Cloud is paid ($15/mo)</text>
</svg>