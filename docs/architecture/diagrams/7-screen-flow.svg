<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>Screen flow</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="560" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Screen flow: from power-on to rematch</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Every screen is a monitor scene. Dashed boxes are later screens: they slot in as new menu items, no other scene changes.</text><rect x="32" y="110" width="150" height="112" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2"/><text x="107" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Boot</text><text x="107" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">load assets</text>
<text x="107" y="172.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">pixel loading bar</text><rect x="222" y="110" width="170" height="112" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="307" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Logo intro</text><text x="307" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">placeholder logo</text>
<text x="307" y="172.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">fades in, holds, out</text>
<text x="307" y="189.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">any button skips</text><rect x="432" y="110" width="190" height="172" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="527" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Home</text><text x="527" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">game title</text>
<text x="527" y="172.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="527" y="189.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="527" y="206.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="527" y="223.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text><rect x="450" y="180" width="154" height="30" rx="6" fill="#ffffff" stroke="#d6337f" stroke-width="1.5"/><text x="527" y="200" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">▶ START GAME  vs CPU</text><rect x="450" y="218" width="154" height="30" rx="6" fill="#ffffff" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="6 5"/><text x="527" y="238" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ONLINE  (later)</text><text x="527" y="268" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">room for more buttons</text><rect x="662" y="110" width="140" height="112" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="732" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fight</text><text x="732" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">best of three</text>
<text x="732" y="172.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">vs the CPU</text><rect x="842" y="110" width="140" height="172" rx="10" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="912" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Result</text><text x="912" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">winner banner</text>
<text x="912" y="172.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">score 2-1</text>
<text x="912" y="189.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="912" y="206.625" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text><rect x="861" y="196" width="102" height="28" rx="6" fill="#ffffff" stroke="#c99700" stroke-width="1.5"/><text x="912" y="215" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">▶ RETRY</text><rect x="861" y="232" width="102" height="28" rx="6" fill="#ffffff" stroke="#c99700" stroke-width="1.5"/><text x="912" y="251" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MAIN MENU</text><path d="M 182 166 L 220 166" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><path d="M 392 166 L 430 166" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><path d="M 604 195 C 630 195, 640 166, 660 166" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="632" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#d6337f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">MatchSetup</text><path d="M 802 166 L 840 166" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="821" y="154" font-size="11.5" font-weight="700" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">KO</text><path d="M 861 210 L 804 210" fill="none" stroke="#c99700" stroke-width="2" marker-end="url(#a-core)"/><text x="831" y="200" font-size="11.5" font-weight="700" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">retry</text><path d="M 861 246 C 780 330, 640 330, 560 284" fill="none" stroke="#c99700" stroke-width="2" marker-end="url(#a-core)"/><text x="712" y="330" font-size="12" font-weight="700" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">main menu</text><text x="32" y="366" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Retry starts a new match with the same MatchSetup (session.rematch(); online, both players must agree).</text><text x="32" y="392" font-size="14" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Later screens hang off Home the same way:</text><rect x="32" y="410" width="216" height="92" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2" stroke-dasharray="6 5"/><text x="140" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Online lobby</text><text x="140" y="456" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">create room / join</text>
<text x="140" y="472.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">with a room code</text><rect x="272" y="410" width="216" height="92" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2" stroke-dasharray="6 5"/><text x="380" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Settings</text><text x="380" y="456" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">music and effects volume</text>
<text x="380" y="472.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">mute, controls</text><rect x="512" y="410" width="216" height="92" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2" stroke-dasharray="6 5"/><text x="620" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Pause</text><text x="620" y="456" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">in a fight: resume</text>
<text x="620" y="472.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">or quit to menu</text><rect x="752" y="410" width="216" height="92" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2" stroke-dasharray="6 5"/><text x="860" y="434" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">How to play</text><text x="860" y="456" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the rules triangle</text>
<text x="860" y="472.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">and the damage</text><text x="32" y="532" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Input in menus: joystick or arrow keys move the cursor, any of the three buttons (or Enter / Space / a tap) confirms, Esc or Android back goes back.</text>
</svg>