<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630">
<title>Local and online sessions</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="630" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Local now, online later: swap the session, keep the scenes</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fight and result screens only see the MatchSession interface. Where the opponent's move comes from is not their business.</text><rect x="300" y="92" width="400" height="70" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="500" y="116" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FightScene + FightDirector + ResultScene</text><text x="500" y="138" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">show phases, play the reveal, send the player's pick</text><rect x="250" y="196" width="500" height="124" rx="12" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="500" y="222" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">MatchSession (session/MatchSession.ts)</text><text x="270" y="248" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">me, rules</text>
<text x="270" y="263" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">ready()</text>
<text x="270" y="278" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">submitPick(move)</text>
<text x="270" y="293" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">requestRematch()</text>
<text x="270" y="308" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">snapshot(): MatchView</text><text x="500" y="248" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">on('phase' | 'locked' |</text>
<text x="500" y="263" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">   'reveal' | 'matchOver' |</text>
<text x="500" y="278" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">   'rematchAccepted', …)</text>
<text x="500" y="293" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">dispose()</text><path d="M 500 162 L 500 194" fill="none" stroke="#1d1533" stroke-width="2" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/><rect x="32" y="364" width="440" height="210" rx="12" fill="#ffffff" stroke="#1a93c4" stroke-width="2"/><text x="48" y="392" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">LocalSession  (built)</text><rect x="48" y="408" width="196" height="66" rx="10" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="62" y="432" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Referee + rules</text><text x="62" y="454" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">browserClock, Math.random</text><rect x="260" y="408" width="196" height="66" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="274" y="432" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Your pick</text><text x="274" y="454" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">always side p1</text><rect x="48" y="492" width="196" height="66" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2"/><text x="62" y="516" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">RandomCpu</text><text x="62" y="538" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">MoveSource, thinks 0.4–1.6 s</text><rect x="260" y="492" width="196" height="66" rx="10" fill="#f7f5fd" stroke="#8f86ad" stroke-width="2" stroke-dasharray="6 5"/><text x="274" y="516" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">More later</text><text x="274" y="538" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">EquilibriumCpu, hot-seat …</text><path d="M 400 322 L 300 362" fill="none" stroke="#1a93c4" stroke-width="2" marker-end="url(#a-session)"/><text x="318" y="350" font-size="12" font-weight="600" text-anchor="end" fill="#1a93c4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">implements</text><rect x="528" y="364" width="440" height="210" rx="12" fill="#ffffff" stroke="#2e9d4f" stroke-width="2" stroke-dasharray="6 5"/><text x="544" y="392" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">OnlineSession  (step 5)</text><rect x="544" y="408" width="180" height="66" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="558" y="432" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WebSocket client</text><text x="558" y="454" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">turns messages into</text>
<text x="558" y="470.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the same events</text><rect x="776" y="408" width="176" height="150" rx="10" fill="#dcf6e1" stroke="#2e9d4f" stroke-width="2"/><text x="790" y="432" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Match room</text><text x="790" y="454" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Referee + rules</text>
<text x="790" y="470.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(same packages/core)</text>
<text x="790" y="487.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="790" y="504.625" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">owns the timer</text>
<text x="790" y="521.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">hides picks</text>
<text x="790" y="538.375" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">random fallback pick</text><path d="M 726 441 L 774 441" fill="none" stroke="#2e9d4f" stroke-width="2" marker-start="url(#a-server)" marker-end="url(#a-server)"/><text x="634" y="504" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">Latency hides inside the</text>
<text x="634" y="520.2" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">reveal window: the client</text>
<text x="634" y="536.4" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">animates while the room</text>
<text x="634" y="552.6" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">waits out revealMs.</text><path d="M 600 322 L 700 362" fill="none" stroke="#1a93c4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-session)"/><text x="684" y="350" font-size="12" font-weight="600" text-anchor="start" fill="#1a93c4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">implements</text><text x="500" y="604" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">createSession(setup) builds the right one for each match: { mode: 'cpu' } now, { mode: 'online', roomCode } later.</text>
</svg>