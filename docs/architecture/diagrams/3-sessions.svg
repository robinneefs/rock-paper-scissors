<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
<title>Local and online sessions</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="600" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Local now, online later: swap the session, keep the scenes</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The fight scene only sees the MatchSession interface. Where the opponent's move comes from is not its business.</text><rect x="300" y="92" width="400" height="70" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="500" y="116" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FightScene + FightDirector</text><text x="500" y="138" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">shows phases, plays the reveal, sends the player's pick</text><rect x="250" y="196" width="500" height="120" rx="12" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="500" y="222" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">MatchSession (interface)</text><text x="270" y="250" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">submitPick(move)</text>
<text x="270" y="266.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">requestRematch()</text>
<text x="270" y="283.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">snapshot(): MatchView</text><text x="520" y="250" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">on('phase', …)</text>
<text x="520" y="266.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">on('locked', …)</text>
<text x="520" y="283.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">on('reveal', …)</text><path d="M 500 162 L 500 194" fill="none" stroke="#1d1533" stroke-width="2" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/><rect x="32" y="360" width="440" height="210" rx="12" fill="#ffffff" stroke="#1a93c4" stroke-width="2"/><text x="48" y="388" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">LocalSession  (step 1 to 4)</text><rect x="48" y="404" width="196" height="66" rx="10" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="62" y="428" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Referee + Rules</text><text x="62" y="450" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">packages/core</text><rect x="260" y="404" width="196" height="66" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="274" y="428" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Your input</text><text x="274" y="450" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">buttons, keys 1/2/3</text><rect x="48" y="488" width="196" height="66" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2"/><text x="62" y="512" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">RandomCpu</text><text x="62" y="534" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">a MoveSource</text><rect x="260" y="488" width="196" height="66" rx="10" fill="#f7f5fd" stroke="#8f86ad" stroke-width="2" stroke-dasharray="6 5"/><text x="274" y="512" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">More later</text><text x="274" y="534" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">SmartCpu, hot-seat …</text><text x="252" y="590" font-size="14" font-weight="400" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text><path d="M 400 318 L 300 358" fill="none" stroke="#1a93c4" stroke-width="2" marker-end="url(#a-session)"/><text x="318" y="346" font-size="12" font-weight="600" text-anchor="end" fill="#1a93c4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">implements</text><rect x="528" y="360" width="440" height="210" rx="12" fill="#ffffff" stroke="#2e9d4f" stroke-width="2" stroke-dasharray="6 5"/><text x="544" y="388" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">OnlineSession  (step 5)</text><rect x="544" y="404" width="180" height="66" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="558" y="428" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Colyseus client</text><text x="558" y="450" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">translates messages</text>
<text x="558" y="466.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">into the same events</text><rect x="776" y="404" width="176" height="150" rx="10" fill="#dcf6e1" stroke="#2e9d4f" stroke-width="2"/><text x="790" y="428" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Server MatchRoom</text><text x="790" y="450" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Referee + Rules</text>
<text x="790" y="466.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(same packages/core)</text>
<text x="790" y="483.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"></text>
<text x="790" y="500.625" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">owns the timer</text>
<text x="790" y="517.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">hides picks</text>
<text x="790" y="534.375" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">random fallback pick</text><path d="M 726 437 L 774 437" fill="none" stroke="#2e9d4f" stroke-width="2" marker-start="url(#a-server)" marker-end="url(#a-server)"/><text x="634" y="500" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">Network latency is hidden</text>
<text x="634" y="516.2" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">behind the phase timings:</text>
<text x="634" y="532.4" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">the client animates while</text>
<text x="634" y="548.6" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">the server waits.</text><path d="M 600 318 L 700 358" fill="none" stroke="#1a93c4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-session)"/><text x="684" y="346" font-size="12" font-weight="600" text-anchor="start" fill="#1a93c4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">implements</text>
</svg>