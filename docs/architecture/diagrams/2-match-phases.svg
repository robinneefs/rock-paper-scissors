<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<title>Match phases</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="520" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Match phases (the referee's state machine)</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">packages/core/src/referee/referee.ts. Durations come from defaultTimings in config.ts, so client and server agree on every step.</text><rect x="32" y="90" width="190" height="50" rx="10" fill="#f7f5fd" stroke="#8f86ad" stroke-width="2"/><text x="127" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">idle</text><text x="127" y="130" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">until session.ready()</text><path d="M 127 140 L 127 168" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="137" y="158" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">start()</text><rect x="32" y="170" width="190" height="112" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="127" y="194" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">roundIntro</text><text x="127" y="216" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">"ROUND 1" banner</text>
<text x="127" y="232.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">"FIGHT!" as it ends</text>
<text x="127" y="249.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">roundIntroMs 1600</text><rect x="282" y="170" width="190" height="112" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="377" y="194" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">picking</text><text x="377" y="216" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">countdown: pickMs 5000</text>
<text x="377" y="232.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">pick or change freely</text>
<text x="377" y="249.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no pick at 0 = random</text><rect x="532" y="170" width="190" height="112" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="627" y="194" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">reveal</text><text x="627" y="216" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">both picks + outcome</text>
<text x="627" y="232.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">applyExchange: damage</text>
<text x="627" y="249.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">revealMs 1800</text><rect x="782" y="170" width="190" height="112" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="877" y="194" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">roundOver</text><text x="877" y="216" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">K.O., winner pose</text>
<text x="877" y="232.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">roundOverMs 2200</text><rect x="782" y="380" width="190" height="112" rx="10" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="877" y="404" font-size="15" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">matchOver</text><text x="877" y="426" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no timer: result screen</text>
<text x="877" y="442.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">start() again = rematch</text><path d="M 222 218 L 280 218" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><path d="M 472 218 L 530 218" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="501" y="206" font-size="12" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">time up</text><path d="M 722 218 L 780 218" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="751" y="206" font-size="12" font-weight="700" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">KO</text><path d="M 627 170 C 627 110, 377 110, 377 168" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="502" y="112" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">both still standing: next exchange</text><path d="M 840 282 C 840 340, 127 340, 127 284" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="480" y="352" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">nobody has 2 rounds yet: startNextRound, health resets</text><path d="M 900 282 L 900 378" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><text x="910" y="322" font-size="12" font-weight="700" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">roundsToWin</text>
<text x="910" y="338.2" font-size="12" font-weight="700" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">reached</text><path d="M 780 436 C 400 480, 90 470, 100 284" fill="none" stroke="#1d1533" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-ink)"/><text x="430" y="492" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">rematch (Retry): fresh match state, old timers cancelled</text>
</svg>