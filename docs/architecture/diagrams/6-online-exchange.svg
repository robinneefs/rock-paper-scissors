<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<title>Online exchange sequence</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="660" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Online exchange: nobody sees the other pick early</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The match room owns the clock and both picks. Clients only learn the opponent's move in the reveal message. (Step 5, not built.)</text><rect x="55" y="90" width="230" height="40" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="170" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player A (OnlineSession)</text><path d="M 170 130 V 630" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="385" y="90" width="230" height="40" rx="10" fill="#dcf6e1" stroke="#2e9d4f" stroke-width="2"/><text x="500" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Match room (server)</text><path d="M 500 130 V 630" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="715" y="90" width="230" height="40" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="830" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player B (OnlineSession)</text><path d="M 830 130 V 630" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M 500 165 L 174 165" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="335" y="157" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">phase {picking, msLeft 5000}</text><path d="M 500 165 L 826 165" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="665" y="157" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">phase {picking, msLeft 5000}</text><path d="M 170 209 L 496 209" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="335" y="201" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pick('throw')</text><path d="M 500 253 L 826 253" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="665" y="245" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">locked {side: A}   (no move!)</text><path d="M 170 297 L 496 297" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="335" y="289" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pick('attack')  changed mind</text><path d="M 830 341 L 504 341" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="665" y="333" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pick('block')</text><path d="M 500 385 L 174 385" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="335" y="377" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">locked {side: B}   (no move!)</text><rect x="340" y="409" width="320" height="64" rx="8" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="500" y="431" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">timer hits 0 on the room's clock</text>
<text x="500" y="447.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">missing pick = random · rules: B wins, 10 dmg</text><path d="M 500 503 L 174 503" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="335" y="495" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">reveal {picks, outcome, state}</text><path d="M 500 503 L 826 503" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="665" y="495" font-size="12" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">reveal {picks, outcome, state}</text><rect x="40" y="535" width="260" height="46" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="170" y="563" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FightDirector plays it in revealMs</text><rect x="700" y="535" width="260" height="46" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="830" y="563" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FightDirector plays it in revealMs</text><text x="500" y="611" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">The room sends time left (msLeft), not its clock time: each client adds it to its own clock, so clocks never need to match.</text>
</svg>