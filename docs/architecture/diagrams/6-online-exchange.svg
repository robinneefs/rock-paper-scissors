<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>Online exchange sequence</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="640" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Online exchange: nobody sees the other pick early</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The server owns the clock and both picks. Clients only learn the opponent's move in the reveal message.</text><rect x="65" y="90" width="210" height="40" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="170" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player A (client)</text><path d="M 170 130 V 610" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="395" y="90" width="210" height="40" rx="10" fill="#dcf6e1" stroke="#2e9d4f" stroke-width="2"/><text x="500" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Server MatchRoom</text><path d="M 500 130 V 610" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="725" y="90" width="210" height="40" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="830" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Player B (client)</text><path d="M 830 130 V 610" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M 500 165 L 174 165" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="335" y="157" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">phase: Picking, endsAt</text><path d="M 500 165 L 826 165" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="665" y="157" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">phase: Picking, endsAt</text><path d="M 170 211 L 496 211" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="335" y="203" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pick(Throw)</text><path d="M 500 257 L 826 257" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="665" y="249" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">locked: A   (no move!)</text><path d="M 170 303 L 496 303" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="335" y="295" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pick(Attack)   changed mind, allowed</text><path d="M 830 349 L 504 349" fill="none" stroke="#d6337f" stroke-width="2" marker-end="url(#a-pres)"/><text x="665" y="341" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">pick(Block)</text><path d="M 500 395 L 174 395" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="335" y="387" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">locked: B   (no move!)</text><rect x="350" y="421" width="300" height="64" rx="8" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="500" y="443" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">timer hits 0 (server clock)</text>
<text x="500" y="459.875" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">missing pick = random · rules: B wins, 10 dmg</text><path d="M 500 515 L 174 515" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="335" y="507" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">reveal(A: Attack, B: Block)</text><path d="M 500 515 L 826 515" fill="none" stroke="#2e9d4f" stroke-width="2" marker-end="url(#a-server)"/><text x="665" y="507" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">reveal(A: Attack, B: Block)</text><rect x="40" y="549" width="260" height="46" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="170" y="577" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">play reveal within revealMs</text><rect x="700" y="549" width="260" height="46" rx="8" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="830" y="577" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">play reveal within revealMs</text>
</svg>