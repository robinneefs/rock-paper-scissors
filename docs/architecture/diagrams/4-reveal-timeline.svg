ze="11" font-weight="400" text-anchor="end" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ms</text><path d="M 960 96 V 456" stroke="#2e9d4f" stroke-width="2" stroke-dasharray="5 4"/><text x="954" y="92" font-size="12" font-weight="700" text-anchor="end" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">timings.revealMs: the reveal phase ends here (shared with the server)</text>
