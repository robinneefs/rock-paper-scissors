<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>Reveal choreography timeline</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="560" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">One reveal, step by step (current values in tuning.ts)</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FightDirector.onReveal plays this from the single reveal event. Every number is a named value in apps/game/src/config/tuning.ts.</text><rect x="24" y="106" width="952" height="48" rx="6" fill="#f4f1fc"/><text x="36" y="135" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Move icons</text><rect x="24" y="162" width="952" height="48" rx="6" fill="#ffffff"/><text x="36" y="191" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fighters</text><rect x="24" y="218" width="952" height="48" rx="6" fill="#f4f1fc"/><text x="36" y="247" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Impact</text><rect x="24" y="274" width="952" height="48" rx="6" fill="#ffffff"/><text x="36" y="303" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Camera</text><rect x="24" y="330" width="952" height="48" rx="6" fill="#f4f1fc"/><text x="36" y="359" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Health bar</text><rect x="24" y="386" width="952" height="48" rx="6" fill="#ffffff"/><text x="36" y="415" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sound</text><rect x="170" y="114" width="140.44444444444446" height="32" rx="6" fill="#ffe0f0" stroke="#d6337f" stroke-width="1.5"/><text x="178" y="135" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">iconDropMs 320</text><rect x="310.44444444444446" y="114" width="649.5555555555555" height="32" rx="6" fill="#ffe0f0" stroke="#d6337f" stroke-width="1.5"/><text x="318.44444444444446" y="135" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">icons stay up (the next picking phase hides them)</text><rect x="170" y="170" width="184.33333333333337" height="32" rx="6" fill="#f7f5fd" stroke="#8f86ad" stroke-width="1.5"/><text x="178" y="191" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">idle</text><rect x="354.33333333333337" y="170" width="87.77777777777771" height="32" rx="6" fill="#ffe3de" stroke="#d0412b" stroke-width="1.5"/><text x="362.33333333333337" y="191" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">strikeAtMs</text><rect x="442.1111111111111" y="170" width="342.33333333333337" height="32" rx="6" fill="#d7f2fd" stroke="#1a93c4" stroke-width="1.5"/><text x="450.1111111111111" y="191" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">loser: hurt pose, pushed back · winner holds the strike</text><path d="M 784.4444444444445 168 l 8 18 l -8 18 l -8 -18 z" fill="#1a93c4"/><text x="796.4444444444445" y="191" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">recoverAtMs → idle</text><path d="M 442.1111111111111 224 l 8 18 l -8 18 l -8 -18 z" fill="#d0412b"/><text x="454.1111111111111" y="247" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">impactAtMs</text><text x="547.4444444444445" y="247" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">flash 2×33 ms · hitPause.byDamage 50/70/90 ms</text><rect x="477.22222222222223" y="282" width="122.88888888888886" height="32" rx="6" fill="#fff1c2" stroke="#c99700" stroke-width="1.5"/><text x="485.22222222222223" y="303" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">shake.byDamage</text><text x="606.6944444444445" y="303" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">2 / 3 / 4 px for 280 ms, whole pixels (K.O.: koPx 5)</text><rect x="477.22222222222223" y="338" width="263.3333333333333" height="32" rx="6" fill="#ece7fd" stroke="#7b61d9" stroke-width="1.5"/><text x="485.22222222222223" y="359" font-size="11.5" font-weight="400" text-anchor="start" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">hud.drainMs 600 (trail follows)</text><rect x="170" y="394" width="790" height="32" rx="6" fill="#f7f5fd" stroke="#8f86ad" stroke-width="1.5" stroke-dasharray="6 5"/><text x="178" y="415" font-size="11.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no sound yet: hit and clash sounds join here in step 3</text><path d="M 170 456 H 960" stroke="#1d1533" stroke-width="1.5"/><path d="M 170 456 v 6" stroke="#1d1533"/><text x="170" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">0</text><path d="M 257.77777777777777 456 v 6" stroke="#1d1533"/><text x="257.77777777777777" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">200</text><path d="M 345.55555555555554 456 v 6" stroke="#1d1533"/><text x="345.55555555555554" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">400</text><path d="M 433.3333333333333 456 v 6" stroke="#1d1533"/><text x="433.3333333333333" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">600</text><path d="M 521.1111111111111 456 v 6" stroke="#1d1533"/><text x="521.1111111111111" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">800</text><path d="M 608.8888888888889 456 v 6" stroke="#1d1533"/><text x="608.8888888888889" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">1000</text><path d="M 696.6666666666666 456 v 6" stroke="#1d1533"/><text x="696.6666666666666" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">1200</text><path d="M 784.4444444444445 456 v 6" stroke="#1d1533"/><text x="784.4444444444445" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">1400</text><path d="M 872.2222222222222 456 v 6" stroke="#1d1533"/><text x="872.2222222222222" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">1600</text><path d="M 960 456 v 6" stroke="#1d1533"/><text x="960" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#5b5378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">1800</text><text x="158" y="478" font-size="11" font-weight="400" text-anchor="end" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">ms</text><path d="M 960 96 V 456" stroke="#2e9d4f" stroke-width="2" stroke-dasharray="5 4"/><text x="954" y="92" font-size="12" font-weight="700" text-anchor="end" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">revealMs 1800: the reveal phase ends here (core config, shared with the server)</text><path d="M 784.4444444444445 492 V 500 H 960 V 492" fill="none" stroke="#2e9d4f" stroke-width="2"/><text x="960" y="518" font-size="12" font-weight="600" text-anchor="end" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">400 ms of slack: room for network delay online</text><text x="32" y="518" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Shake and drain start once the hit-pause is over.</text>
<text x="32" y="534.2" font-size="12" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Tie: at impactAtMs a 1 px shake and the CLASH! banner, no damage.</text>
</svg>