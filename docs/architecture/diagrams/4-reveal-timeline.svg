<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">One reveal, step by step (starting values, all tunable)</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The FightDirector plays this as a timeline. Every number is a named value in tuning.ts, never hard-coded in a scene.</text><rect x="24" y="106" width="952" height="48" rx="6" fill="#f4f1fc"/><text x="36" y="135" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Move icons</text><rect x="24" y="162" width="952" height="48" rx="6" fill="#ffffff"/><text x="36" y="191" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fighters</text><rect x="24" y="218" width="952" height="48" rx="6" fill="#f4f1fc"/><text x="36" y="247" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Impact</text><rect x="24" y="274" width="952" height="48" rx="6" fill="#ffffff"/><text x="36" y="303" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Camera</text><rect x="24" y="330" width="952" height="48" rx="6" fill="#f4f1fc"/><text x="36" y="359" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Health bar</text><rect x="24" y="386" width="952" height="48" rx="6" fill="#ffffff"/><text x="36" y="415" font-size="13.5" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sound</text><rect x="170" y="114" width="1