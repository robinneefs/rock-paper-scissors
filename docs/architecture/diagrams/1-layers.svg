<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>Layers and dependencies</title>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1533"/></marker>
<marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f86ad"/></marker>
<marker id="a-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99700"/></marker>
<marker id="a-session" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a93c4"/></marker>
<marker id="a-pres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6337f"/></marker>
<marker id="a-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d4f"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d0412b"/></marker>
<marker id="a-plat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b61d9"/></marker>
<pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#241640"/><path d="M8 0H0V8" fill="none" stroke="#33205a" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="640" rx="14" fill="#fbfaff"/>
<text x="32" y="44" font-size="22" font-weight="800" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Layers and who may use whom</text><text x="32" y="68" font-size="14" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Arrows mean "uses". They only point down: lower layers never know about higher ones.</text><rect x="24" y="88" width="640" height="520" rx="14" fill="#ffffff" stroke="#e7e3f3" stroke-width="2"/><text x="40" y="114" font-size="13" font-weight="700" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">apps/game  (the browser game, later wrapped for Android)</text><rect x="40" y="126" width="608" height="64" rx="10" fill="#ece7fd" stroke="#7b61d9" stroke-width="2"/><text x="54" y="150" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Platform</text><text x="54" y="172" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Browser page now, Capacitor later. Pixel scaler, storage and haptics behind small adapters.</text><rect x="40" y="210" width="608" height="150" rx="10" fill="#ffe0f0" stroke="#d6337f" stroke-width="2"/><text x="54" y="234" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Presentation (Phaser)</text><text x="54" y="254" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Draws, animates, plays sound, reads input. Never decides who wins.</text><rect x="54" y="272" width="88" height="72" rx="8" fill="#fff7fb" stroke="#d6337f" stroke-width="1.5"/><text x="98" y="313" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Scenes</text><rect x="152" y="272" width="88" height="72" rx="8" fill="#fff7fb" stroke="#d6337f" stroke-width="1.5"/><text x="196" y="313" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Fight director</text><rect x="250" y="272" width="88" height="72" rx="8" fill="#fff7fb" stroke="#d6337f" stroke-width="1.5"/><text x="294" y="313" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Views</text><rect x="348" y="272" width="88" height="72" rx="8" fill="#fff7fb" stroke="#d6337f" stroke-width="1.5"/><text x="392" y="313" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">FX / juice</text><rect x="446" y="272" width="88" height="72" rx="8" fill="#fff7fb" stroke="#d6337f" stroke-width="1.5"/><text x="490" y="313" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Audio</text><rect x="544" y="272" width="88" height="72" rx="8" fill="#fff7fb" stroke="#d6337f" stroke-width="1.5"/><text x="588" y="313" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Input</text><rect x="40" y="380" width="608" height="100" rx="10" fill="#d7f2fd" stroke="#1a93c4" stroke-width="2"/><text x="54" y="404" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Session (plain TypeScript, no Phaser)</text><text x="54" y="424" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">One interface for "a match in progress". Scenes talk only to this.</text><rect x="54" y="436" width="180" height="34" rx="8" fill="#f1fbff" stroke="#1a93c4" stroke-width="1.5"/><text x="144" y="458" font-size="13" font-weight="700" text-anchor="middle" fill="#1d1533" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" xml:space="preserve">MatchSession</text><rect x="244" y="436" width="180" height="34" rx="8" fill="#f1fbff" stroke="#1a93c4" stroke-width="1.5"/><text x="334" y="458" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">LocalSession + CPU</text><rect x="434" y="436" width="200" height="34" rx="8" fill="#f1fbff" stroke="#1a93c4" stroke-width="1.5" stroke-dasharray="6 5"/><text x="534" y="458" font-size="13" font-weight="400" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">OnlineSession (later)</text><rect x="40" y="500" width="608" height="92" rx="10" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="54" y="524" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Core  ·  packages/core  ·  zero dependencies</text><rect x="54" y="538" width="184" height="40" rx="8" fill="#fffaea" stroke="#c99700" stroke-width="1.5"/><text x="146" y="563" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Rules (pure)</text><rect x="248" y="538" width="184" height="40" rx="8" fill="#fffaea" stroke="#c99700" stroke-width="1.5"/><text x="340" y="563" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Referee (phases)</text><rect x="442" y="538" width="192" height="40" rx="8" fill="#fffaea" stroke="#c99700" stroke-width="1.5"/><text x="538" y="563" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Rules config</text><path d="M 344 360 L 344 378" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><path d="M 344 480 L 344 498" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><rect x="700" y="88" width="276" height="520" rx="14" fill="#ffffff" stroke="#e7e3f3" stroke-width="2" stroke-dasharray="6 5"/><text x="716" y="114" font-size="13" font-weight="700" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">apps/server  (online, later)</text><rect x="716" y="380" width="244" height="100" rx="10" fill="#dcf6e1" stroke="#2e9d4f" stroke-width="2" stroke-dasharray="6 5"/><text x="730" y="404" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Colyseus MatchRoom</text><text x="730" y="426" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Runs the timer and the referee</text>
<text x="730" y="442.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Keeps picks secret until reveal</text>
<text x="730" y="459.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sends events to both players</text><rect x="716" y="500" width="244" height="92" rx="10" fill="#fff1c2" stroke="#c99700" stroke-width="2"/><text x="730" y="524" font-size="15" font-weight="700" text-anchor="start" fill="#1d1533" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Same packages/core</text><text x="730" y="546" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Identical rules on client and</text>
<text x="730" y="562.875" font-size="12.5" font-weight="400" text-anchor="start" fill="#5b5378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">server: results always agree.</text><path d="M 838 480 L 838 498" fill="none" stroke="#1d1533" stroke-width="2" marker-end="url(#a-ink)"/><path d="M 636 453 C 670 453, 680 430, 714 430" fill="none" stroke="#2e9d4f" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#a-server)" marker-end="url(#a-server)"/><text x="662" y="418" font-size="12" font-weight="600" text-anchor="middle" fill="#2e9d4f" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">WebSocket</text><path d="M 648 546 L 714 546" fill="none" stroke="#c99700" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#a-core)" marker-end="url(#a-core)"/><text x="681" y="534" font-size="12" font-weight="700" text-anchor="middle" fill="#c99700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">shared</text>
</svg>